<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#00B2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="斩词">
<title>医学英语斩词</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{
  --sky:#00B2FF; --sky-deep:#0090E0; --yellow:#FFCE31; --green:#35C97A; --green-deep:#25A862;
  --orange:#FF9A3C; --red:#FF5B5B; --purple:#8C7BFF;
  --bg:#F1F6FB; --card:#FFFFFF; --ink:#16283C; --sub:#8496A8; --line:#E4EDF5;
  --sh:0 12px 30px rgba(23,88,150,.14), 0 3px 8px rgba(23,88,150,.08);
  --fs:32px;
}
html[data-theme="dark"]{
  --bg:#0D1520; --card:#18222F; --ink:#E9F1F8; --sub:#8FA3B8; --line:#243244;
  --sky:#38BFFF; --sh:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);background:var(--bg);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
  display:flex;flex-direction:column;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
button{font-family:inherit}

/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;gap:9px;padding:12px 16px 6px}
.logo{
  width:36px;height:36px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--sky),#5CD6FF);
  display:grid;place-items:center;font-size:20px;box-shadow:0 5px 14px rgba(0,178,255,.4)
}
.title{font-size:17px;font-weight:800;flex:1;min-width:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:12px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:5px;flex:0 0 auto
}
.pill b{color:var(--sky-deep);font-size:15px}
html[data-theme="dark"] .pill b{color:var(--sky)}
.tool{width:36px;height:36px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;cursor:pointer;flex:0 0 auto}

/* ===== 进度 ===== */
.prog{margin:6px 16px 12px}
.prog .track{height:12px;border-radius:999px;background:rgba(0,140,224,.13);overflow:hidden;position:relative}
html[data-theme="dark"] .prog .track{background:#22303f}
.prog .track i{
  display:block;height:100%;width:0;border-radius:999px;transition:width .4s cubic-bezier(.3,1.3,.5,1);
  background:linear-gradient(90deg,var(--sky),#6FE3A3)
}
.prog .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:var(--sub);margin-top:6px}

/* ===== 模式标签 ===== */
.tabs{display:flex;gap:7px;padding:0 16px 11px}
.tabs button{
  flex:1;min-width:0;min-height:44px;border-radius:15px;border:none;background:var(--card);color:var(--sub);
  font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(23,88,150,.08);transition:transform .12s
}
.tabs button:active{transform:scale(.95)}
.tabs button[aria-pressed="true"]{
  background:linear-gradient(150deg,var(--sky),var(--sky-deep));color:#fff;box-shadow:0 7px 18px rgba(0,178,255,.42)
}
.chips{display:flex;gap:8px;padding:0 16px 11px;overflow-x:auto;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:33px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--sub);font-size:13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px
}
.chip[aria-pressed="true"]{background:#E3F5FF;border-color:var(--sky);color:var(--sky-deep)}
html[data-theme="dark"] .chip[aria-pressed="true"]{background:#153046;color:#6FD0FF}
.chip .n{opacity:.6}
.chip .em{font-size:15px}

/* ===== 卡片 ===== */
main{flex:1;display:flex;flex-direction:column;padding:2px 16px 10px;min-height:0;min-width:0}
.card{
  background:var(--card);border-radius:28px;box-shadow:var(--sh);overflow:hidden;position:relative;
  flex:1;display:flex;flex-direction:column;animation:in .34s cubic-bezier(.2,1.2,.4,1)
}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.pic{
  height:clamp(132px,19vh,208px);display:grid;place-items:center;position:relative;flex:0 0 auto;
  background:linear-gradient(140deg,var(--c1,#BFE9FF),var(--c2,#E8F7FF))
}
.pic>*{position:relative;z-index:2}
.pic .em{font-size:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.14))}
.pic .wm{position:absolute;right:14px;bottom:-10px;font-size:74px;font-weight:900;color:rgba(255,255,255,.5);letter-spacing:-3px}
html[data-theme="dark"] .pic .wm{color:rgba(255,255,255,.13)}
html[data-theme="dark"] .star{background:rgba(0,0,0,.3);color:#B9CBDD}
html[data-theme="dark"] .pic::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(9,16,26,.5)}
.pic .utag{
  position:absolute;left:14px;top:12px;background:rgba(255,255,255,.82);border-radius:999px;
  padding:5px 11px;font-size:11px;font-weight:900;color:#2A4A66;letter-spacing:.4px
}
html[data-theme="dark"] .pic .utag{background:rgba(0,0,0,.3);color:#DCEBF7}
.body{padding:22px 20px 24px;position:relative;flex:1;display:flex;flex-direction:column;justify-content:center}
.word{
  font-size:var(--fs);line-height:1.2;font-weight:900;letter-spacing:-.4px;word-break:break-word;
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",sans-serif
}
.word .blank{color:var(--sky);letter-spacing:1px}
.word .tip{color:var(--green-deep)}
html[data-theme="dark"] .word .tip{color:var(--green)}
.phon{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--sub);font-size:13px;font-weight:700}
.spk{
  width:34px;height:34px;border-radius:12px;border:none;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(150deg,var(--sky),var(--sky-deep));color:#fff;font-size:15px;
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,178,255,.4)
}
.spk:active{transform:scale(.92)}
.mean{
  margin-top:16px;background:#F3F9FE;border-radius:16px;padding:14px 15px;font-size:17px;font-weight:800;line-height:1.55
}
html[data-theme="dark"] .mean{background:#132030}
.mean .key{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--sub)}
.mean .key b{color:var(--sky-deep);font-size:15px}
html[data-theme="dark"] .mean .key b{color:var(--sky)}
.star{position:absolute;top:12px;right:12px;z-index:4;border:none;cursor:pointer;line-height:1;font-size:20px;
  width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.8);display:grid;place-items:center}
.star{color:#9FB3C8}
.star[aria-pressed="true"]{color:var(--yellow);text-shadow:0 3px 10px rgba(255,206,49,.7)}
input[type=text]{
  width:100%;margin-top:16px;font-size:19px;font-weight:800;font-family:inherit;color:var(--ink);
  background:#F3F9FE;border:2px solid var(--line);border-radius:16px;padding:14px 16px;outline:none
}
html[data-theme="dark"] input[type=text]{background:#132030}
input[type=text]:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(0,178,255,.16)}
.verdict{margin-top:12px;font-size:15px;font-weight:900;min-height:22px}
.verdict.ok{color:var(--green-deep)} .verdict.bad{color:var(--red)}
html[data-theme="dark"] .verdict.ok{color:var(--green)}
.empty{display:grid;place-items:center;flex:1;text-align:center;color:var(--sub);font-weight:800}
.empty .big{font-size:56px;display:block;margin-bottom:12px}
.empty .s{font-size:12px;font-weight:700;margin-top:6px}

/* 四选一 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{
  min-height:64px;border-radius:18px;border:2px solid var(--line);background:#F7FBFF;color:var(--ink);
  font-size:15px;font-weight:800;cursor:pointer;padding:10px 12px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center
}
html[data-theme="dark"] .opt{background:#132030}
.opt:active{transform:scale(.97)}
.opt.right{background:linear-gradient(150deg,var(--green),var(--green-deep));border-color:var(--green);color:#fff}
.opt.wrong{background:#FFEFEF;border-color:var(--red);color:var(--red)}
html[data-theme="dark"] .opt.wrong{background:#3a1c22;color:#FF9A9A}

/* ===== 底部按钮 ===== */
footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px}
.btn{
  min-height:56px;border-radius:20px;border:none;font-size:17px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s
}
.btn:active{transform:scale(.96)}
.btn.doubt{flex:1;background:linear-gradient(150deg,#FFC07F,var(--orange));color:#7A3E00;box-shadow:0 7px 18px rgba(255,154,60,.36)}
.btn.know{flex:1;background:linear-gradient(150deg,#5FE0A0,var(--green-deep));color:#fff;box-shadow:0 7px 18px rgba(53,201,122,.42)}
.btn.go{flex:1;background:linear-gradient(150deg,var(--sky),var(--sky-deep));color:#fff;box-shadow:0 7px 18px rgba(0,178,255,.42)}
.btn.skip{flex:0 0 auto;min-width:92px;background:var(--card);color:var(--sub);border:1.5px solid var(--line);font-size:15px}
.btn.off{opacity:.45}

/* ===== 反馈 ===== */
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}50%{transform:translateX(-7px)}}
.shake{animation:shake .42s}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--card);font-size:14px;font-weight:800;padding:11px 18px;border-radius:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.25);animation:tin .2s ease-out;max-width:80vw;text-align:center
}
.toast.ok{background:linear-gradient(150deg,#5FE0A0,var(--green-deep));color:#fff}
.toast.bad{background:linear-gradient(150deg,#FF8A8A,#E04040);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.floatup{
  position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:60;pointer-events:none;
  background:linear-gradient(150deg,#5FE0A0,var(--green-deep));color:#fff;font-weight:900;font-size:18px;
  padding:11px 22px;border-radius:999px;box-shadow:0 12px 26px rgba(53,201,122,.5);animation:fly 1.05s ease-out forwards
}
@keyframes fly{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}22%{opacity:1}100%{opacity:0;transform:translate(-50%,-78px) scale(1.08)}}

/* ===== 弹层 ===== */
.sheet{position:fixed;inset:0;background:rgba(10,25,40,.5);display:none;align-items:flex-end;z-index:70;backdrop-filter:blur(4px)}
.sheet.on{display:flex}
.panel{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px;animation:up .26s ease-out}
@keyframes up{from{transform:translateY(46px);opacity:.5}to{transform:none;opacity:1}}
.panel h2{margin:0;font-size:19px;font-weight:900}
.lab{font-size:13px;font-weight:900;color:var(--sub)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow button{
  min-height:44px;padding:0 16px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);
  color:var(--sub);font-size:14px;font-weight:800;cursor:pointer
}
.btnrow button[aria-pressed="true"]{background:linear-gradient(150deg,var(--sky),var(--sky-deep));border-color:var(--sky);color:#fff}
.stat{font-size:14px;color:var(--sub);line-height:1.95;font-weight:800}
.stat b{color:var(--sky-deep);font-size:19px}
html[data-theme="dark"] .stat b{color:var(--sky)}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-size:12px;color:var(--sub)}
@media (min-width:760px){
  .topbar,.prog,.tabs,.chips,main,footer{max-width:520px;margin-left:auto;margin-right:auto;width:100%}
}
</style>
</head>

      +'<div class="opts">'+opts.map((o,i)=>'<button class="opt'+cls(o,i)+'" data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div>');
    bar.innerHTML='<button class="btn skip" id="skipBtn">跳过</button>'
      +'<button class="btn go '+(answered===null?'off':'')+'" id="nextBtn">下一个 →</button>';
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=Number(b.dataset.i); if(answered!==null) return;
      answered=i; judged=true;
      const ok=opts[i]===c.c;
      mark(c.id,ok); if(ok){count();cheer();} save(); buzz(ok); render();
    });
    $('skipBtn').onclick=()=>step();
    $('nextBtn').onclick=()=>step();
  }

  else if(S.mode==='spell'){
    if(!answered){
      card.innerHTML=shell(c,
        '<div class="mean" style="margin-top:2px">'+esc(c.c||'（无释义）')+'</div>'
        +'<div class="phon" style="margin-top:12px"><span>拼出对应的英文</span></div>'
        +'<input type="text" id="inp" placeholder="English…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">'
        +'<div class="verdict" id="verdict"></div>');
      bar.innerHTML='<button class="btn skip" id="skipBtn">跳过</button><button class="btn go" id="submitBtn">提交</button>';
      $('skipBtn').onclick=()=>step(); $('submitBtn').onclick=submit;
      setTimeout(()=>{const i=$('inp'); if(i)i.focus();},120);
    } else {
      const ok=answered==='ok';
      card.innerHTML=shell(c,
        '<div class="mean" style="margin-top:2px">'+esc(c.c||'')+'</div>'
        +'<div class="word" style="margin-top:14px;color:'+(ok?'var(--green-deep)':'var(--sky-deep)')+'">'+esc(c.p)+'</div>'
        +'<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'✓ 拼对了':'✗ 正确答案如上')+'</div>'
        +'<div class="phon"><button class="spk" data-speak="'+esc(c.p)+'">🔊</button></div>');
      bar.innerHTML='<button class="btn go" id="nextBtn">下一个 →</button>';
      $('nextBtn').onclick=()=>step();
    }
  }

  else {
    const sent=c.s.replace(/__BLANK__/g,'<span class="blank">＿＿＿＿</span>');
    if(!answered){
      card.innerHTML=shell(c,
        '<div class="word" style="font-size:calc(var(--fs) - 6px)">'+sent+'</div>'
        +'<div class="mean">'+esc(c.c||'')+'</div>'
        +'<input type="text" id="inp" placeholder="填入空里的词" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">'
        +'<div class="verdict" id="verdict"></div>');
      bar.innerHTML='<button class="btn skip" id="skipBtn">跳过</button><button class="btn go" id="submitBtn">提交</button>';
      $('skipBtn').onclick=()=>step(); $('submitBtn').onclick=submit;
      setTimeout(()=>{const i=$('inp'); if(i)i.focus();},120);
    } else {
      const ok=answered==='ok';
      const filled=c.s.replace(/__BLANK__/g,'<span class="tip">'+esc(c.a)+'</span>');
      card.innerHTML=shell(c,
        '<div class="word" style="font-size:calc(var(--fs) - 6px)">'+filled+'</div>'
        +'<div class="mean">'+esc(c.c||'')+'</div>'
        +'<div class="verdict '+(ok?'ok':'bad')+'">'+(ok?'✓ 答对了':'✗ 正确答案：'+esc(c.a))+'</div>'
        +'<div class="phon"><button class="spk" data-speak="'+esc(c.p)+'">🔊</button></div>');
      bar.innerHTML='<button class="btn go" id="nextBtn">下一个 →</button>';
      $('nextBtn').onclick=()=>step();
    }
  }
  card.querySelectorAll('[data-speak]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.speak);});
  const st=$('starBtn'); if(st) st.onclick=()=>{ if(S.star[c.id]) delete S.star[c.id]; else S.star[c.id]=1; save(); render(); };
}

function makeOptions(c){
  const pool=DATA.filter(x=>x.id!==c.id && x.c).map(x=>x.c);
  const seen=new Set([c.c]), distract=[];
  let guard=0;
  while(distract.length<3 && guard++<400){
    const v=pool[Math.floor(Math.random()*pool.length)];
    if(v && !seen.has(v)){ seen.add(v); distract.push(v); }
  }
  const all=[c.c,...distract];
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  return all;
}
function submit(){
  const c=cur(); const inp=$('inp'); if(!c||!inp) return;
  const val=(inp.value||'').trim().toLowerCase();
  if(!val){ inp.classList.add('shake'); setTimeout(()=>inp.classList.remove('shake'),420); return; }
  const target=(S.mode==='cloze'?(c.a||''):c.p).toLowerCase();
  const ok=val===target||val.replace(/\s+/g,' ')===target.replace(/\s+/g,' ');
  answered=ok?'ok':'bad'; mark(c.id,ok); if(ok){count();cheer();} save(); buzz(ok); render();
  if(!ok){ const cd=$('card'); cd.classList.add('shake'); setTimeout(()=>cd.classList.remove('shake'),420); }
}
function mark(id,ok){ if(ok){S.known[id]=1; delete S.wrong[id];} else {S.wrong[id]=1;} }
function step(){ idx=(idx+1)%(deck.length||1); judged=false; answered=null; optCache=null; render(); }
function prev(){ idx=(idx-1+(deck.length||1))%(deck.length||1); judged=false; answered=null; optCache=null; render(); }

function buildUnitBar(){
  const units=[...new Set(DATA.map(x=>x.u))].sort((a,b)=>a-b);
  $('unitBar').innerHTML=units.map(u=>'<button class="chip" data-unit="'+u+'" aria-pressed="false">'
    +'<span class="em">'+(UNIT[u]||['📘'])[0]+'</span>Unit '+u+'<span class="n">'+DATA.filter(x=>x.u===u).length+'</span></button>').join('');
  $('unitBar').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.unit=Number(b.dataset.unit);S.scope='all';save();buildDeck();render();});
}
function sheet(h){ $('panel').innerHTML=h; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
$('sheet').onclick=e=>{ if(e.target===$('sheet')) closeSheet(); };
$('setBtn').onclick=()=>{
  sheet('<h2>设置</h2><div class="lab">字号</div><div class="btnrow">'
    +'<button data-fs="26" aria-pressed="'+(S.fs===26)+'">小</button><button data-fs="32" aria-pressed="'+(S.fs===32)+'">标准</button>'
    +'<button data-fs="38" aria-pressed="'+(S.fs===38)+'">大</button><button data-fs="44" aria-pressed="'+(S.fs===44)+'">特大</button></div>'
    +'<div class="lab">主题</div><div class="btnrow"><button data-theme="light" aria-pressed="'+(S.theme==='light')+'">☀️ 浅色</button>'
    +'<button data-theme="dark" aria-pressed="'+(S.theme==='dark')+'">🌙 深色</button></div>'
    +'<div class="lab">顺序</div><div class="btnrow"><button data-shuffle="0" aria-pressed="'+(!S.shuffle)+'">按课程顺序</button>'
    +'<button data-shuffle="1" aria-pressed="'+S.shuffle+'">每天随机</button></div>'
    +'<div class="lab">每日目标</div><div class="btnrow"><button data-goal="10" aria-pressed="'+(S.goal===10)+'">10 词</button>'
    +'<button data-goal="20" aria-pressed="'+(S.goal===20)+'">20 词</button><button data-goal="40" aria-pressed="'+(S.goal===40)+'">40 词</button></div>'
    +'<div class="lab">进度备份（换设备时用）</div><div class="btnrow">'
    +'<button id="expBtn">📤 导出进度</button><button id="impBtn">📥 导入进度</button></div>'
    +'<div id="bakBox"></div>'
    +'<div class="stat">键盘：<kbd>空格</kbd> 显示/下一个 · <kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>S</kbd> 收藏</div>'
    +'<div class="btnrow"><button data-close="1" style="flex:1;background:linear-gradient(150deg,var(--sky),var(--sky-deep));border-color:var(--sky);color:#fff">完成</button></div>');
  $('panel').querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{S.fs=+b.dataset.fs;save();applyTheme();closeSheet();});
  $('panel').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;save();applyTheme();closeSheet();});
  $('panel').querySelectorAll('[data-shuffle]').forEach(b=>b.onclick=()=>{S.shuffle=b.dataset.shuffle==='1';save();buildDeck();render();closeSheet();});
  $('panel').querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();render();closeSheet();});
  $('panel').querySelector('[data-close]').onclick=closeSheet;
  const box=$('bakBox');
  const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');
  const dec=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
  $('expBtn').onclick=()=>{
    const code=enc({v:1,known:S.known,wrong:S.wrong,star:S.star,day:S.day,
                    fs:S.fs,theme:S.theme,shuffle:S.shuffle,goal:S.goal});
    box.innerHTML='<textarea id="bakTxt" readonly spellcheck="false" style="width:100%;min-height:110px;'
      +'font-size:11px;font-family:ui-monospace,monospace;border:2px solid var(--line);border-radius:14px;padding:10px;'
      +'background:var(--bg);color:var(--sub)">'+code+'</textarea>'
      +'<div class="btnrow"><button id="cpBtn" style="flex:1">复制这段码</button></div>';
    $('cpBtn').onclick=async()=>{
      const t=$('bakTxt'); t.select(); t.setSelectionRange(0,99999);
      try{ await navigator.clipboard.writeText(t.value); $('cpBtn').textContent='✓ 已复制'; }
      catch(e){ document.execCommand('copy'); $('cpBtn').textContent='✓ 已选中，请长按复制'; }
      setTimeout(()=>$('cpBtn').textContent='复制这段码',1800);
    };
  };
  $('impBtn').onclick=()=>{
    box.innerHTML='<textarea id="bakTxt" placeholder="把另一台设备导出的码粘到这里" spellcheck="false" '
      +'style="width:100%;min-height:110px;font-size:11px;font-family:ui-monospace,monospace;'
      +'border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);color:var(--ink)"></textarea>'
      +'<div class="btnrow"><button id="doImp" style="flex:1;background:linear-gradient(150deg,var(--sky),var(--sky-deep));'
      +'border-color:var(--sky);color:#fff">恢复进度</button></div>';
    $('doImp').onclick=()=>{
      try{
        const o=dec($('bakTxt').value||'');
        if(!o||typeof o!=='object'||!o.known) throw new Error('bad');
        S.known=o.known; S.wrong=o.wrong||{}; S.star=o.star||{}; S.day=o.day||{};
        if(o.fs)S.fs=o.fs; if(o.theme)S.theme=o.theme; if(o.goal)S.goal=o.goal;
        save(); applyTheme(); toast('✓ 进度已恢复','ok'); setTimeout(()=>location.reload(),700);
      }catch(e){ toast('这段码读不出来，确认是完整复制的','bad'); }
    };
  };
};
$('statsBtn').onclick=()=>{
  const total=DATA.length,known=Object.keys(S.known).length,wrong=Object.keys(S.wrong).length,star=Object.keys(S.star).length;
  const done=todayCount();
  sheet('<h2>我的战绩</h2><div class="stat">今日已斩 <b>'+done+'</b> / '+S.goal+(done>=S.goal?' 🎉 达成':'')
    +'<br>累计记住 <b>'+known+'</b> / '+total+'（'+Math.round(known/total*100)+'%）<br>错题 <b>'+wrong+'</b> · 收藏 <b>'+star+'</b></div>'
    +'<div class="btnrow"><button data-reset="1">清空进度</button>'
    +'<button data-close="1" style="flex:1;background:linear-gradient(150deg,var(--sky),var(--sky-deep));border-color:var(--sky);color:#fff">关闭</button></div>');
  $('panel').querySelector('[data-close]').onclick=closeSheet;
  const rb=$('panel').querySelector('[data-reset]');
  rb.onclick=()=>{ if(rb.dataset.armed){ LS.del(KEY); location.reload(); return; }
    rb.dataset.armed='1'; rb.textContent='再点一次确认清空'; rb.style.color='var(--red)';
    setTimeout(()=>{ if(rb){delete rb.dataset.armed; rb.textContent='清空进度'; rb.style.color='';} },3000); };
};
$('modeBar').onclick=e=>{const b=e.target.closest('button'); if(!b)return; S.mode=b.dataset.mode; save(); buildDeck(); render();};
$('scopeBar').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return; S.scope=b.dataset.scope; save(); buildDeck(); render();};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ if(e.key==='Enter'){e.preventDefault();submit();} return; }
  if(e.key===' '){ e.preventDefault(); const r=$('revealBtn')||$('nextBtn')||$('submitBtn'); if(r) r.click(); }
  else if(e.key==='ArrowRight') step();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key.toLowerCase()==='s'){ const st=$('starBtn'); if(st) st.click(); }
});
let tx=0,ty=0;
$('card').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$('card').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6){ dx<0?step():prev(); }
},{passive:true});

applyTheme(); buildUnitBar(); buildDeck(); render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
